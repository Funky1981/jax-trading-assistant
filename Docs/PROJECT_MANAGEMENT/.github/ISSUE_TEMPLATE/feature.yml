name: Feature
description: Plan a feature linked to the roadmap and backlog
title: "[Feature]: "
labels: ["feature"]
body:
  - type: input
    id: roadmap
    attributes:
      label: Roadmap Link
      description: Which roadmap phase does this belong to?
      placeholder: "Phase 2 — Useful MVP"
    validations:
      required: true
  - type: input
    id: backlog
    attributes:
      label: Backlog Item
      placeholder: "ITEM-000"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired Outcome
      description: What should be true when this is done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Use checkboxes.
      value: |
        - [ ] 
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks / Notes
      description: Any technical, product, security, delivery, or operational risks?
