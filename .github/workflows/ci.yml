name: ci

on:
  push:
    branches: [main, work, capability-reset]
  pull_request:
  workflow_dispatch:
    inputs:
      run_integration:
        description: "Run integration tests"
        required: false
        default: "false"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.4"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.13.2
          args: >-
            ./...
            ./libs/backtest/...
            ./libs/contracts/...
            ./libs/database/...
            ./libs/ingest/...
            ./libs/marketdata/...
            ./libs/observability/...
            ./libs/resilience/...
            ./libs/strategies/...
            ./libs/testing/...
            ./libs/trading/executor/...
            ./libs/utcp/...
            ./tools/...
      - name: gofmt
        run: |
          files="$(git diff --name-only --diff-filter=ACMRT HEAD^1 HEAD -- '*.go')"
          if [ -n "$files" ]; then
            unformatted="$(gofmt -l $files)"
            if [ -n "$unformatted" ]; then
              echo "$unformatted"
              exit 1
            fi
          fi
      - name: runtime policy tests
        run: go test ./libs/runtimepolicy ./libs/utcp
      - name: go test (memory stack)
        run: go test ./cmd/db-migrate/... ./cmd/research/... ./libs/pgmemory/...
      - name: go test
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.x"
      - name: install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: lint
        working-directory: frontend
        run: npm run lint
      - name: typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: test
        working-directory: frontend
        run: npm run test
      - name: playwright install
        working-directory: frontend
        run: npx playwright install --with-deps
      - name: e2e
        working-directory: frontend
        run: npm run test:e2e
      - name: upload playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  integration:
    if: github.event_name == 'workflow_dispatch' && inputs.run_integration == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.4"
      - name: go test (integration)
        run: go test -tags=integration ./...
