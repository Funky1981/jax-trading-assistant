name: ci

on:
  push:
    branches: [main, work, capability-reset]
  pull_request:
  workflow_dispatch:
    inputs:
      run_integration:
        description: "Run integration tests"
        required: false
        default: "false"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.8"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.13.2
          args: >-
            ./...
            ./libs/backtest/...
            ./libs/contracts/...
            ./libs/database/...
            ./libs/ingest/...
            ./libs/marketdata/...
            ./libs/observability/...
            ./libs/resilience/...
            ./libs/strategies/...
            ./libs/testing/...
            ./libs/trading/executor/...
            ./libs/utcp/...
            ./tools/...
      - name: gofmt
        run: |
          files="$(git diff --name-only --diff-filter=ACMRT HEAD^1 HEAD -- '*.go')"
          if [ -n "$files" ]; then
            unformatted="$(gofmt -l $files)"
            if [ -n "$unformatted" ]; then
              echo "$unformatted"
              exit 1
            fi
          fi
      - name: runtime policy tests
        run: go test ./libs/runtimepolicy ./libs/utcp
      - name: go test (memory stack)
        run: go test ./cmd/db-migrate/... ./cmd/research/... ./libs/pgmemory/...
      - name: go test
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"
      - name: install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: lint
        working-directory: frontend
        run: npm run lint
      - name: typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: test
        working-directory: frontend
        run: npm run test
      - name: playwright install
        working-directory: frontend
        run: npx playwright install --with-deps
      - name: e2e
        working-directory: frontend
        run: npm run test:e2e
      - name: upload playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  integration:
    runs-on: ubuntu-latest
    env:
      PAPER02R_REQUIRED_INTEGRATION: "true"
      DATABASE_URL: postgresql://jax:jax@localhost:5432/jax_paper02r_test?sslmode=disable
      TEST_DATABASE_URL: postgresql://jax:jax@localhost:5432/jax_paper02r_test?sslmode=disable
      PAPER01B_DATABASE_URL: postgresql://jax:jax@localhost:5432/jax_paper02r_test?sslmode=disable
      PAPER02_DATABASE_URL: postgresql://jax:jax@localhost:5432/jax_paper02r_test?sslmode=disable
      HARNESS_POSTGRES_DSN: postgresql://jax:jax@localhost:5432/jax_paper02r_test?sslmode=disable
      MIGRATIONS_DIR: db/postgres/migrations
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: jax
          POSTGRES_PASSWORD: jax
          POSTGRES_DB: jax_paper02r_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jax -d jax_paper02r_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.8"
      - name: apply disposable PostgreSQL migrations
        run: go run ./cmd/db-migrate
      - name: required PostgreSQL integration tests
        run: >-
          go test -count=1
          ./internal/testsupport
          ./internal/modules/harnessstate
          ./internal/modules/exploratorypaper
          ./internal/modules/approvals
          ./internal/modules/candidates
      - name: required PostgreSQL frontend signal integration tests
        run: >-
          go test -count=1 ./cmd/trader
          -run 'Test(SignalsListHandlerExpiresLegacyPendingSignals|RecommendationsListHandlerExcludesExpiredPendingSignals|SignalApproveRejectsExpiredPendingSignal|SignalApproveBlocksETFEntryBypass)$'
      - name: required replay and lifecycle race tests
        run: >-
          go test -race -count=1
          ./internal/modules/harnessstate
          ./internal/modules/exploratorypaper
